<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      overflow-y: auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 1400px;
    }

    .preview-block {
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      display: block;
      text-decoration: none;
      background: #0a0c10;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .preview-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .preview-block:hover img {
      transform: scale(1.18);
    }

    @media (max-width: 1280px) {
      .gallery-grid {
        grid-template-columns: repeat(8, 1fr);
      }
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }
    }

    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <main class="gallery-grid">
    <a href="01-geometric-eye/index.html" class="preview-block" aria-label="Piece 1">
      <img src="eye_preview.svg" alt="01">
    </a>
    <a href="02-terminal-heritage/index.html" class="preview-block" aria-label="Piece 2">
      <img src="img_1_1765648020127.jpg" alt="02">
    </a>
  </main>

</body>
</html>
