<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    .gallery-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
      max-width: 900px;
    }

    .preview-block {
      flex: 1;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #06080c;
      text-decoration: none;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.4s ease, 
                  box-shadow 0.4s ease;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .preview-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .preview-block:hover {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.08);
    }

    .preview-block:hover img {
      transform: scale(1.05);
    }

    @media (max-width: 720px) {
      .gallery-grid {
        flex-direction: column;
        gap: 20px;
      }
      .preview-block {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

  <main class="gallery-grid">
    <a href="01-geometric-eye/index.html" class="preview-block" aria-label="Piece 1">
      <img src="eye_preview.svg" alt="Eye Preview">
    </a>
    <a href="02-terminal-heritage/index.html" class="preview-block" aria-label="Piece 2">
      <img src="img_1_1765648020127.jpg" alt="Heritage Preview">
    </a>
  </main>

</body>
</html>
